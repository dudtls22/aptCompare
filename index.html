    function getApiProxyBase() {
      return API_PROXY_BASE;

    async function parseApiJsonResponse(res) {
      const ct = res.headers.get("content-type") || "";
      const text = await res.text();
      if (ct.includes("application/json") || (text.startsWith("{") && text.endsWith("}"))) {
        try {
          return JSON.parse(text);
        } catch {
          throw new Error("API 응답 JSON 파싱 실패");
        }
      }
      if (res.status === 404) {
        throw new Error(
          "API 404: Vercel에 api/ 가 배포되지 않았습니다. Output Directory·Build Command를 비우고 Redeploy 하세요."
        );
      }
      throw new Error(`API 오류 HTTP ${res.status}`);
    }

    function computeLocalApiBase(port) {
      return `http://127.0.0.1:${port}`;
    }

    async function probeSameOriginApi() {
      try {
        const origin = window.location.origin;
        if (!origin || origin === "null") return false;
        const res = await fetch(`${origin}/api/health`, {
          signal: AbortSignal.timeout(3000)
        });
        if (!res.ok) return false;
        const data = await res.json();
        return data?.ok === true;
      } catch {
        return false;
      }
    }

    async function resolveApiProxyBase() {
      const host = window.location.hostname;
      const pagePort = window.location.port;
      const proto = window.location.protocol;

      if (proto === "file:") {
        return discoverLocalApiBase();
      }

      if (host.endsWith(".vercel.app")) {
        return "";
      }

      if (host === "localhost" || host === "127.0.0.1") {
        if (LOCAL_API_PORTS_TRY.some((p) => String(p) === pagePort)) {
          return "";
        }
        return discoverLocalApiBase();
      }

      // GitHub Pages 등 정적 호스팅만 Vercel API 사용
      if (host.endsWith(".github.io")) {
        return VERCEL_API_PROXY_BASE;
      }

      // VPS·사설 IP·도메인으로 npm start 접속 → 같은 서버 API
      if (await probeSameOriginApi()) {
        return "";
      }

      return discoverLocalApiBase();
    }

    async function discoverLocalApiBase() {
      for (const port of LOCAL_API_PORTS_TRY) {
        try {
          const base = computeLocalApiBase(port);
          const res = await fetch(`${base}/api/health`, {
            signal: AbortSignal.timeout(2000)
          });
          if (!res.ok) continue;
          const data = await res.json();
          if (data?.ok) return base;
        } catch {
          /* 다음 포트 시도 */
        }
      }
      return computeLocalApiBase(LOCAL_API_PORTS_TRY[0]);
    }

    function openAppModal(overlay, triggerEl) {
      if (!overlay) return;
      const trigger =
        triggerEl ||
        (document.activeElement instanceof HTMLElement ? document.activeElement : null);
      if (trigger && !overlay.contains(trigger)) {
        modalRestoreFocus.set(overlay, trigger);
      }
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeAppModal(overlay) {
      if (!overlay) return;
      const restore = modalRestoreFocus.get(overlay);
      modalRestoreFocus.delete(overlay);
      const focused = document.activeElement;

      if (restore && typeof restore.focus === "function") {
        restore.focus({ preventScroll: true });
      } else if (focused instanceof HTMLElement && overlay.contains(focused)) {
        focused.blur();
      }

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

      const fromData = Number(cardEl?.dataset?.compareSlot);

        if (cardEl?.classList?.contains("c" + i)) return i;

    /** 공공데이터 API 조회용 LAWD_CD (강원 42↔51 등 구·신 코드 병행) */
    function lawdApiCodesForQuery(lawdCd) {
      const c = String(lawdCd || "").trim();
      if (!c || c.length !== 5) return c ? [c] : [];
      const out = [c];
      const prefixPairs = [
        ["51", "42"],
        ["52", "45"]
      ];
      for (const [nw, old] of prefixPairs) {
        if (c.startsWith(nw)) out.push(old + c.slice(2));
        if (c.startsWith(old)) out.push(nw + c.slice(2));
      }
      return [...new Set(out)];
    }

    /** UI 시군구 목록에 있는 코드로 변환 (구법정동 42→51 등) */
    function mapLawdCdToUiDistrictCode(lawdCd) {
      const c = String(lawdCd || "").trim();
      if (!c) return "";
      for (const region of REGION_OPTIONS) {
        if (getDistrictOptions(region.code).some((d) => d.code === c)) return c;
      }
      for (const alt of lawdApiCodesForQuery(c)) {
        for (const region of REGION_OPTIONS) {
          if (getDistrictOptions(region.code).some((d) => d.code === alt)) return alt;
        }
      }
      return c;
    }

    async function fetchTradeItemsForLawdMonths(lawdCd, targetMonths) {
      const codes = lawdApiCodesForQuery(lawdCd);
      const allItems = [];
      for (const code of codes) {
        const monthResults = await Promise.allSettled(
          targetMonths.map((m) => fetchOneMonthCached({ lawdCd: code, ymParam: m.ymParam }))
        );
        for (const result of monthResults) {
          if (result.status === "fulfilled" && Array.isArray(result.value)) {
            allItems.push(...result.value);
          }
        }
      }
      if (!allItems.length) {
        const monthResults = await Promise.allSettled(
          targetMonths.map((m) => fetchOneMonthCached({ lawdCd: codes[0], ymParam: m.ymParam }))
        );
        const rej = monthResults.find((r) => r.status === "rejected");
        if (rej) {
          throw rej.reason instanceof Error
            ? rej.reason
            : new Error(String(rej.reason || "월별 API 호출 실패"));
        }
      }
      return allItems;
    }

    function removeCompareSlot(slotId) {
      if (slotId <= 1) return;
      const idx = slots.findIndex((s) => s.id === slotId);
      if (idx < 0) return;
      const slot = slots[idx];
      clearCompareSlotFields(slot);
      slot.cardEl.remove();
      slots.splice(idx, 1);
      updateAddCompareButton();
      setMessage(`비교 ${slotId} 영역을 삭제했습니다.`);
    }

        '<button type="button" class="btn-link btn-fav-pick" data-fav-pick-slot="' + slotId + '"><span class="btn-fav-pick-icon" aria-hidden="true">★</span><span class="btn-fav-pick-text">찜에서 선택</span></button>' +
        "</div>" +
        '<select id="areaSelect' + slotId + '"><option value="">전체</option></select></div>' +
        "</div>";
      return {
        id: slotId,
        color: theme.color,
        cardEl: card,
        dongEl: card.querySelector("#dongSelect" + slotId),
        aptEl: card.querySelector("#aptSelect" + slotId),
        areaEl: card.querySelector("#areaSelect" + slotId)
      };
    }

    function addCompareSlot(options = {}) {
      if (slots.length >= MAX_COMPARE_SLOTS) return null;
      const slotId = getNextSlotId();
      if (!slotId) return null;
      const slot = buildCompareSlotCard(slotId);
      slots.push(slot);
      const root = compareSlotsRoot || document.getElementById("compareSlotsRoot");
      root.appendChild(slot.cardEl);
      bindSlotEvents(slot);
      const first = slots[0];
      if (options.syncDong && first && first.id !== slot.id && first.dongEl.options.length > 1) {
        cloneDongSelectOptions(first.dongEl, slot.dongEl);
        renderAptOptions(slot.aptEl, []);
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
      }
      updateAddCompareButton();
      return slot;
    }

    function slotFromCardEl(cardEl, slotId) {
      const theme = SLOT_THEME[slotId] || SLOT_THEME[1];
      return {
        id: slotId,
        color: theme.color,
        cardEl,
        dongEl: cardEl.querySelector("#dongSelect" + slotId),
        aptEl: cardEl.querySelector("#aptSelect" + slotId),
        areaEl: cardEl.querySelector("#areaSelect" + slotId)
      };
    }

    function setupCompareSectionDom() {
      const wrap = document.querySelector(".compare-wrap");
      if (!wrap) return;

      wrap.classList.add("compare-section");

      let compareTitle = wrap.querySelector(".compare-section-title");
      if (!compareTitle) {
        compareTitle = document.createElement("p");
        compareTitle.className = "section-title compare-section-title";
        wrap.insertBefore(compareTitle, wrap.firstChild);
      }
      compareTitle.textContent = "아파트 비교";

      let root = document.getElementById("compareSlotsRoot");
      if (!root) {
        root = document.createElement("div");
        root.id = "compareSlotsRoot";
        root.className = "compare-slots-stack";
        const title = wrap.querySelector(".compare-section-title");
        wrap.insertBefore(root, title ? title.nextSibling : wrap.firstChild);
      }

      const legacyCards = [...wrap.querySelectorAll(":scope > .compare-card")];
      for (const card of legacyCards) {
        const legacyId = slotIdFromCardEl(card);
        if (legacyId > 1) {
          card.remove();
          continue;
        }
        if (!root.contains(card)) {
          root.appendChild(card);
        }
      }

      if (!document.getElementById("addCompareSlotBtn")) {
        const row = document.createElement("div");
        row.className = "compare-add-row";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.id = "addCompareSlotBtn";
        btn.className = "btn-secondary btn-add-compare";
        btn.textContent = "아파트 추가+";
        row.appendChild(btn);
        wrap.appendChild(row);
      }
    }

    function initCompareSlots() {
      setupCompareSectionDom();
      compareSlotsRoot = document.getElementById("compareSlotsRoot");
      addCompareSlotBtn = document.getElementById("addCompareSlotBtn");
      if (addCompareSlotBtn) addCompareSlotBtn.textContent = "아파트 추가+";
      const root = compareSlotsRoot;
      const addBtn = addCompareSlotBtn;

      slots = [];
      const existingCards = [...root.querySelectorAll(".compare-card")];
      if (existingCards.length) {
        for (const card of existingCards) {
          const id = slotIdFromCardEl(card);
          const slot = slotFromCardEl(card, id);
          if (slot.dongEl && slot.aptEl && slot.areaEl) {
            slots.push(slot);
            bindSlotEvents(slot);
          }
        }
      } else {
        addCompareSlot();
      }

      updateAddCompareButton();

      if (!root.dataset.favDelegated) {
        root.dataset.favDelegated = "1";
        root.addEventListener("click", (e) => {
          const removeBtn = e.target.closest("[data-remove-slot]");
          if (removeBtn) {
            removeCompareSlot(Number(removeBtn.getAttribute("data-remove-slot")));
            return;
          }
          const btn = e.target.closest("[data-fav-pick-slot]");
          if (!btn) return;
          const sid = Number(btn.getAttribute("data-fav-pick-slot"));
          if (Number.isFinite(sid)) void openSlotFavoritePicker(sid, btn);
        });
      }

      if (addBtn && !addBtn.dataset.bound) {
        addBtn.dataset.bound = "1";
        addBtn.addEventListener("click", () => {
          addCompareSlot({ syncDong: true });
          setMessage("아파트 비교 영역이 추가되었습니다. (비교 " + slots.length + ")");
        });
      }
    }

    /* ========================================================================
       유틸 · 거래 데이터 파싱
       ======================================================================== */
    function setMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.className = isError ? "error" : "";
    }

    function ymToString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `${y}${m}`;
    }

    function formatKrw(value) {
      return Number(value).toLocaleString("ko-KR") + "만원";
    }

    function parseDealAmount(amountText) {
      return Number(String(amountText).replaceAll(",", "").trim());
    }

    function normalizeDongName(name) {
      return String(name || "").replaceAll(" ", "").trim();
    }

    function dongCoreName(name) {
      const n = normalizeDongName(name);
      if (!n) return "";
      if (n.endsWith("동")) return n.slice(0, -1);
      return n;
    }

    function isSameDong(itemDongName, selectedDongName) {
      const a = normalizeDongName(itemDongName);
      const b = normalizeDongName(selectedDongName);
      if (!a || !b) return false;
      if (a === b) return true;
      const aCore = dongCoreName(a);
      const bCore = dongCoreName(b);
      return Boolean(aCore) && aCore === bCore;
    }

    function getDongName(item) {
      return String(
        item?.umdNm ??
        item?.UMD_NM ??
        item?.umd_nm ??
        item?.dong ??
        item?.DONG ??
        item?.법정동 ??
        ""
      ).trim();
    }

    function setSelectValueProgrammatic(selectEl, value) {
      if (!selectEl) return;
      selectEl.dataset.programmatic = "1";
      try {
        selectEl.value = value == null ? "" : String(value);
      } finally {
        queueMicrotask(() => {
          delete selectEl.dataset.programmatic;
        });
      }
    }

    function itemMatchesSelectedDong(item, dongName) {
      if (!dongName) return true;
      const itemDong = getDongName(item);
      if (!itemDong) return false;
      if (isSameDong(itemDong, dongName)) return true;
      return normalizeDongName(itemDong) === normalizeDongName(dongName);
    }

    function getAptName(item) {
      return String(item?.aptNm || item?.apartment || item?.아파트 || "").trim();
    }

    function getAreaValue(item) {
      const raw = item?.excluUseAr || item?.exclusiveArea || item?.전용면적;
      const n = Number.parseFloat(String(raw ?? "").replaceAll(",", "").trim());
      return Number.isFinite(n) ? n : null;
    }

    function getAreaFloorValue(item) {
      const area = getAreaValue(item);
      if (area == null) return null;
      return Math.floor(area);
    }

    function getDealDateLabel(item, fallbackYm) {
      const y = String(item?.dealYear || "").trim();
      const m = String(item?.dealMonth || "").trim().padStart(2, "0");
      const d = String(item?.dealDay || "").trim().padStart(2, "0");
      if (y && m && d) return `${y}-${m}-${d}`;
      return `${fallbackYm}-01`;
    }

    function getFloor(item) {
      return String(item?.floor || item?.층 || "").trim();
    }

    function isDealCancelled(item) {
      const cdealDay = String(item?.cdealDay ?? item?.CDEAL_DAY ?? "").trim();
      if (cdealDay && cdealDay !== "-" && cdealDay !== "0" && cdealDay !== "00") return true;
      const cdealType = String(item?.cdealType ?? item?.CDEAL_TYPE ?? "").trim();
      if (cdealType && cdealType !== "-" && cdealType !== "0") return true;
      const gbn = String(item?.dealingGbn ?? item?.DEALING_GBN ?? "").trim();
      return /취소|해제/.test(gbn);
    }

    function sortStringsKoAsc(list) {
      return [...list].map(String).sort((a, b) => a.localeCompare(b, "ko"));
    }

    function sortAreaM2Asc(list) {
      return [...list].map(String).sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
    }

    /* ========================================================================
       셀렉트 UI · 지역/동/아파트 목록
       ======================================================================== */
    function setupRegionSelect() {
      regionSelect.innerHTML = REGION_OPTIONS.map((region) => (
        `<option value="${region.code}">${region.name}</option>`
      )).join("");
      regionSelect.value = "seoul";
    }

    function getDistrictOptions(regionCode = regionSelect.value) {
      return Array.isArray(DISTRICT_OPTIONS_BY_REGION[regionCode])
        ? DISTRICT_OPTIONS_BY_REGION[regionCode]
        : [];
    }

    function findRegionCodeByLawdCd(lawdCd) {
      const code = String(lawdCd || "");
      const direct = REGION_OPTIONS.find((region) => (
        getDistrictOptions(region.code).some((district) => district.code === code)
      ))?.code;
      if (direct) return direct;
      const p2 = code.slice(0, 2);
      return LAWD_PREFIX_TO_REGION[p2] || "";
    }

    function getDistrictName(lawdCd) {
      const code = String(lawdCd || "");
      for (const region of REGION_OPTIONS) {
        const district = getDistrictOptions(region.code).find((d) => d.code === code);
        if (district) return district.name;
      }
      return "";
    }

    function setupDistrictSelect(regionCode = regionSelect.value, preferredCode = "") {
      const region = REGION_OPTIONS.find((r) => r.code === regionCode) || REGION_OPTIONS[0];
      const districts = getDistrictOptions(region.code);
      const sorted = [...districts].sort((a, b) => a.name.localeCompare(b.name, "ko"));
      districtLabel.textContent = region.districtLabel;
      guSelect.innerHTML = sorted.map((district) => (
        `<option value="${district.code}">${district.name}</option>`
      )).join("");
      const defaultCode = DEFAULT_LAWD_BY_REGION[region.code] || sorted[0]?.code || "";
      const fallbackCode =
        defaultCode && sorted.some((d) => d.code === defaultCode) ? defaultCode : (sorted[0]?.code || "");
      const mappedPreferred = mapLawdCdToUiDistrictCode(preferredCode);
      guSelect.value =
        mappedPreferred && sorted.some((d) => d.code === mappedPreferred)
          ? mappedPreferred
          : fallbackCode;
    }

    function setupMonthsSelect() {
      const items = [
        { value: "6", label: "6개월" },
        { value: "12", label: "12개월" },
        { value: "24", label: "24개월" },
        { value: "36", label: "36개월" }
      ].sort((a, b) => a.label.localeCompare(b.label, "ko", { numeric: true }));
      monthsSelect.innerHTML = items.map((it) => (
        `<option value="${it.value}"${it.value === "12" ? " selected" : ""}>${it.label}</option>`
      )).join("");
    }

    function renderDongOptions(selectEl, dongNames) {
      const options = ['<option value="">선택 안함</option>'];
      for (const dong of sortStringsKoAsc(dongNames)) {
        options.push(`<option value="${dong}">${dong}</option>`);
      }
      selectEl.innerHTML = options.join("");
      selectEl.disabled = false;
    }

    function renderAptOptions(selectEl, aptNames) {
      const options = ['<option value="">선택 안함</option>'];
      for (const aptName of sortStringsKoAsc(aptNames)) {
        options.push(`<option value="${aptName}">${aptName}</option>`);
      }
      selectEl.innerHTML = options.join("");
      selectEl.disabled = false;
    }

    function renderAreaOptions(selectEl, areaValues) {
      const options = ['<option value="">전체</option>'];
      for (const area of sortAreaM2Asc(areaValues)) {
        options.push(`<option value="${area}">${area}㎡</option>`);
      }
      selectEl.innerHTML = options.join("");
      selectEl.disabled = false;
    }

    function renderAreaPlaceholder(selectEl, text) {
      selectEl.innerHTML = `<option value="">${text}</option>`;
      selectEl.disabled = true;
    }

    function buildTargetMonths(monthCount) {
      const result = [];
      const cursor = new Date();
      cursor.setDate(1);
      for (let i = monthCount - 1; i >= 0; i--) {
        const d = new Date(cursor.getFullYear(), cursor.getMonth() - i, 1);
        result.push({
          ym: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
          ymParam: ymToString(d)
        });
      }
      return result;
    }

    /* ========================================================================
       공공데이터 API · 차트
       ======================================================================== */
    async function fetchOneMonth({ lawdCd, ymParam }) {
      let lastError;

      for (const route of API_PROXY_ROUTES) {
        try {
          const params = new URLSearchParams({
            target: route.target,
            LAWD_CD: lawdCd,
            DEAL_YMD: ymParam,
            pageNo: "1",
            numOfRows: "1000",
            _type: "json"
          });
          const url = `${getApiProxyBase()}/api/proxy?${params.toString()}`;
          const res = await fetch(url);
          const rawText = await res.text();
          if (!res.ok) {
            let detail = "";
            try {
              const errBody = JSON.parse(rawText);
              if (errBody?.error === "missing_service_key") {
                throw new Error(
                  errBody.message ||
                    "Vercel 환경변수 DATA_GO_KR_SERVICE_KEY 가 없습니다. Settings → Environment Variables 에 추가 후 Redeploy 하세요."
                );
              }
              if (errBody?.message) detail = `: ${errBody.message}`;
            } catch (parseErr) {
              if (parseErr?.message?.includes("DATA_GO_KR")) throw parseErr;
            }
            throw new Error(`HTTP ${res.status} (${route.label} 프록시)${detail}`);
          }

          let data;
          try {
            data = JSON.parse(rawText);
          } catch {
            throw new Error(
              `(${route.label}) 공공데이터 응답이 JSON이 아닙니다. serviceKey·활용신청 상태를 확인하세요.`
            );
          }
          const header = data?.response?.header;
          const resultCode = String(header?.resultCode ?? "");
          const isSuccess = resultCode === "00" || resultCode === "000";
          if (!isSuccess) {
            throw new Error(
              `${header?.resultMsg || "API 오류"} (코드: ${resultCode || "N/A"}, ${route.label} 엔드포인트)`
            );
          }
          const items = data?.response?.body?.items?.item || [];
          return Array.isArray(items) ? items : [items];
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("알 수 없는 API 오류");
    }

    function fetchOneMonthCached({ lawdCd, ymParam }) {
      const key = `${lawdCd}::${ymParam}`;
      if (!monthDataPromiseCache[key]) {
        monthDataPromiseCache[key] = fetchOneMonth({ lawdCd, ymParam })
          .catch((err) => {
            delete monthDataPromiseCache[key];
            throw err;
          });
      }
      return monthDataPromiseCache[key];
    }

    function collectDealPoints(monthlyRows, condition) {
      const points = [];
      for (const { ym, items } of monthlyRows) {
        for (const it of items) {
          if (condition.dong && !itemMatchesSelectedDong(it, condition.dong)) continue;
          if (condition.apt && getAptName(it) !== condition.apt) continue;
          if (condition.area) {
            const area = getAreaFloorValue(it);
            if (area == null || String(area) !== condition.area) continue;
          }

          const cancelled = isDealCancelled(it);
          const price = parseDealAmount(it.dealAmount);
          if (!cancelled && (!Number.isFinite(price) || price <= 0)) continue;
          const rawDong = String(getDongName(it) || "").trim();
          const fallbackDong = String(condition.dong || "").trim();
          const af = getAreaFloorValue(it);
          points.push({
            dateLabel: getDealDateLabel(it, ym),
            price: Number.isFinite(price) ? price : 0,
            cancelled,
            aptName: getAptName(it) || "-",
            dongName: rawDong || fallbackDong || "-",
            areaFloor: af != null ? String(af) : "",
            floor: getFloor(it) || "-",
            lineLabel: condition.label,
            lineColor: condition.color,
            lawdCd: condition.lawdCd
          });
        }
      }

      points.sort((a, b) => a.dateLabel.localeCompare(b.dateLabel));
      return points;
    }

    function getStaticDongOptions(lawdCd) {
      return Array.isArray(SEOUL_DONGS_BY_GU[lawdCd]) ? SEOUL_DONGS_BY_GU[lawdCd] : [];
    }

    function forEachDongSelect(onSelect) {
      const seen = new Set();
      for (const slot of slots) {
        if (slot?.dongEl && !seen.has(slot.dongEl)) {
          seen.add(slot.dongEl);
          onSelect(slot.dongEl, slot);
        }
      }
      if (seen.size === 0) {
        for (let i = 1; i <= MAX_COMPARE_SLOTS; i++) {
          const el = document.getElementById("dongSelect" + i);
          if (el && !seen.has(el)) {
            seen.add(el);
            onSelect(el, null);
          }
        }
      }
    }

    function forEachCompareSlot(onSlot) {
      if (slots.length) {
        slots.forEach(onSlot);
        return;
      }
      forEachDongSelect((dongEl) => {
        const id = Number(String(dongEl.id || "").replace("dongSelect", "")) || 1;
        onSlot({
          id,
          dongEl,
          aptEl: document.getElementById("aptSelect" + id),
          areaEl: document.getElementById("areaSelect" + id)
        });
      });
    }

    function renderDongLoading(text = "동 목록 불러오는 중...") {
      forEachCompareSlot((slot) => {
        slot.dongEl.innerHTML = `<option value="">${text}</option>`;
        slot.dongEl.disabled = true;
        if (slot.aptEl) renderAptOptions(slot.aptEl, []);
        if (slot.areaEl) renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
      });
    }

    async function getDongOptionsByDistrict(lawdCd) {
      const fixedDongs = getStaticDongOptions(lawdCd);
      if (fixedDongs.length) return fixedDongs;

      const key = String(lawdCd || "");
      if (!dongOptionsPromiseCache[key]) {
        dongOptionsPromiseCache[key] = (async () => {
          const targetMonths = buildTargetMonths(24);
          const items = await fetchTradeItemsForLawdMonths(lawdCd, targetMonths);
          const dongSet = new Set();
          for (const item of items) {
            const dongName = getDongName(item);
            if (dongName) dongSet.add(dongName);
          }
          return sortStringsKoAsc(Array.from(dongSet));
        })().catch((err) => {
          delete dongOptionsPromiseCache[key];
          throw err;
        });
      }
      return dongOptionsPromiseCache[key];
    }

    async function loadDongOptionsByDistrict(lawdCd) {
      renderDongLoading();
      const dongNames = await getDongOptionsByDistrict(lawdCd);
      forEachCompareSlot((slot) => {
        renderDongOptions(slot.dongEl, dongNames);
        if (slot.aptEl) renderAptOptions(slot.aptEl, []);
        if (slot.areaEl) renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
      });
      return dongNames;
    }

    async function loadAptAreaOptions({ lawdCd, dongName }) {
      const key = `${lawdCd}::${dongName}`;
      if (aptAreaCache[key]) {
        return aptAreaCache[key];
      }

      const targetMonths = buildTargetMonths(24);
      const aptSet = new Set();
      const areaByAptSet = {};
      const items = await fetchTradeItemsForLawdMonths(lawdCd, targetMonths);
      for (const item of items) {
        if (!itemMatchesSelectedDong(item, dongName)) continue;
        const aptName = getAptName(item);
        if (!aptName) continue;
        aptSet.add(aptName);
        if (!areaByAptSet[aptName]) areaByAptSet[aptName] = new Set();
        const area = getAreaFloorValue(item);
        if (area != null) areaByAptSet[aptName].add(String(area));
      }

      const aptNames = sortStringsKoAsc(Array.from(aptSet));
      const areaByApt = {};
      for (const aptName of aptNames) {
        areaByApt[aptName] = sortAreaM2Asc(Array.from(areaByAptSet[aptName] || []));
      }
      const result = { aptNames, areaByApt };
      if (aptNames.length) aptAreaCache[key] = result;
      return result;
    }

    function buildComparisonDatasets(monthlyRows, conditions) {
      const labels = monthlyRows.map((row) => row.ym);
      const datasets = conditions.map((condition) => {
        const data = monthlyRows.map(({ items }) => {
          const prices = items
            .filter((it) => !isDealCancelled(it))
            .filter((it) => !condition.dong || itemMatchesSelectedDong(it, condition.dong))
            .filter((it) => getAptName(it) === condition.apt)
            .filter((it) => {
              if (!condition.area) return true;
              const area = getAreaFloorValue(it);
              return area != null && String(area) === condition.area;
            })
            .map((it) => parseDealAmount(it.dealAmount))
            .filter((n) => Number.isFinite(n) && n > 0);
          if (!prices.length) return null;
          return Math.round(prices.reduce((sum, n) => sum + n, 0) / prices.length);
        });

        return {
          label: condition.label,
          data,
          borderColor: condition.color,
          backgroundColor: `${condition.color}33`,
          fill: false,
          tension: 0.2,
          spanGaps: true,
          pointRadius: 3,
          showLine: true
        };
      });

      return { labels, datasets };
    }

    function drawChart(labels, datasets) {
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("priceChart"), {
        type: "line",
        data: {
          labels,
          datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  if (ctx.raw == null) return "거래 데이터 없음";
                  return `${ctx.dataset.label}: ${formatKrw(ctx.raw)}`;
                }
              }
            }
          },
          scales: {
            y: {
              ticks: {
                callback: (v) => Number(v).toLocaleString("ko-KR")
              }
            }
          }
        }
      });
    }

    /* ========================================================================
       즐겨찾기 (Upstash Redis) · 카카오 알림
       ======================================================================== */
    const CLIENT_ID_STORAGE_KEY = "aptCompareClientId";
    const LEGACY_FAVORITES_STORAGE_KEY = "aptPriceCompareFavorites";
    const FAVORITES_MIRROR_KEY = "aptCompareFavoritesMirror";
    let legacyFavoritesMigrated = false;

    function readFavoritesMirror() {
      try {
        const raw = localStorage.getItem(FAVORITES_MIRROR_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr)
          ? arr.map(normalizeFavoriteEntry).filter((f) => f.lawdCd && f.apt)
          : [];
      } catch {
        return [];
      }
    }

    function writeFavoritesMirror(list) {
      const normalized = list.map(normalizeFavoriteEntry).filter((f) => f.lawdCd && f.apt);
      localStorage.setItem(FAVORITES_MIRROR_KEY, JSON.stringify(normalized));
      return normalized;
    }

    function getClientId() {
      let id = localStorage.getItem(CLIENT_ID_STORAGE_KEY);
      if (!id) {
        id =
          typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : `client-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(CLIENT_ID_STORAGE_KEY, id);
      }
      return id;
    }

    function normalizeFavoriteEntry(entry) {
      return {
        lawdCd: String(entry?.lawdCd ?? "").trim(),
        guName: String(entry?.guName ?? "").trim(),
        dong: String(entry?.dong ?? "").trim(),
        apt: String(entry?.apt ?? "").trim(),
        area: entry?.area != null && String(entry.area).trim() !== "" ? String(entry.area).trim() : "",
        notify: Boolean(entry?.notify)
      };
    }

    /** 서버(Redis 또는 로컬 파일) + 브라우저 미러에서 즐겨찾기 조회 */
    async function readFavorites() {
      const clientId = getClientId();
      try {
        const res = await fetch(
          `${getApiProxyBase()}/api/favorites?clientId=${encodeURIComponent(clientId)}`,
          {
            headers: { "X-Client-Id": clientId },
            cache: "no-store"
          }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.message || `HTTP ${res.status}`);
        }

        let loaded = Array.isArray(data?.favorites)
          ? data.favorites.map(normalizeFavoriteEntry)
          : [];

        if (!legacyFavoritesMigrated && !loaded.length) {
          legacyFavoritesMigrated = true;
          const legacyRaw = localStorage.getItem(LEGACY_FAVORITES_STORAGE_KEY);
          if (legacyRaw) {
            try {
              const legacy = JSON.parse(legacyRaw);
              if (Array.isArray(legacy) && legacy.length) {
                loaded = legacy.map(normalizeFavoriteEntry).filter((f) => f.lawdCd && f.apt);
                localStorage.removeItem(LEGACY_FAVORITES_STORAGE_KEY);
                const saved = await persistFavorites(loaded, { silent: true });
                loaded = saved.favorites;
              }
            } catch {
              /* 이전 localStorage 형식 오류 무시 */
            }
          }
        }

        if (data?.store?.warning) {
          console.warn("[favorites]", data.store.warning);
        }
        if (loaded.length) {
          writeFavoritesMirror(loaded);
        } else {
          const mirror = readFavoritesMirror();
          if (mirror.length) loaded = mirror;
        }
        return loaded;
      } catch (err) {
        const mirror = readFavoritesMirror();
        if (mirror.length) {
          console.warn("[favorites] API 실패, 브라우저 저장분 사용:", err.message);
          return mirror;
        }
        throw err;
      }
    }

    async function persistFavorites(list, options = {}) {
      const normalized = list.map(normalizeFavoriteEntry).filter((f) => f.lawdCd && f.apt);
      const clientId = getClientId();
      try {
        const res = await fetch(`${getApiProxyBase()}/api/favorites`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Client-Id": clientId
          },
          cache: "no-store",
          body: JSON.stringify({ clientId, favorites: normalized })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.message || `HTTP ${res.status}`);
        }
        const favorites = Array.isArray(data?.favorites)
          ? data.favorites.map(normalizeFavoriteEntry)
          : normalized;
        writeFavoritesMirror(favorites);
        if (data?.store?.warning && !options.silent) {
          console.warn("[favorites]", data.store.warning);
        }
        return { ...data, favorites };
      } catch (err) {
        const saved = writeFavoritesMirror(normalized);
        if (!options.silent) {
          setMessage(
            `서버 저장 실패, 이 브라우저에만 저장했습니다: ${err.message}\n로컬은 .env 에 Upstash 2종을 넣거나 npm start 로 접속하세요.`,
            true
          );
        }
        return { favorites: saved, storage: "browser-mirror" };
      }
    }

    async function writeFavorites(list) {
      return persistFavorites(list);
    }

    function isFavoriteInList(entry, favoritesList) {
      const k = favoriteKey(entry);
      return favoritesList.some((e) => favoriteKey(e) === k);
    }

    function favoriteKey(entry) {
      const lawdCd = String(entry?.lawdCd ?? "").trim();
      const dong = normalizeDongName(entry.dong);
      const apt = String(entry?.apt ?? "").trim();
      const area = String(entry?.area ?? "").trim();
      const base = `${lawdCd}|${dong}|${apt}`;
      if (!area) {
        return base;
      }
      return `${base}|${area}`;
    }

    async function toggleFavorite(entry) {
      const list = await readFavorites();
      const k = favoriteKey(entry);
      const idx = list.findIndex((e) => favoriteKey(e) === k);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.push(normalizeFavoriteEntry(entry));
      }
      try {
        await writeFavorites(list);
        if (list.find((e) => favoriteKey(e) === k)?.notify) {
          setMessage("즐겨찾기 저장됨. 🔔 알림 ON — 매일 9:30(한국시간) 신규 등록 실거래 시 카카오톡으로 알려드립니다.");
        }
      } catch (err) {
        setMessage(`즐겨찾기 저장 실패: ${err.message}`, true);
        throw err;
      }
    }

    async function removeFavoriteByKey(key) {
      const list = await readFavorites();
      await writeFavorites(list.filter((e) => favoriteKey(e) !== key));
    }

    async function setFavoriteNotify(key, enabled) {
      const list = await readFavorites();
      const idx = list.findIndex((e) => favoriteKey(e) === key);
      if (idx < 0) return;
      list[idx].notify = Boolean(enabled);
      const data = await writeFavorites(list);
      return data;
    }

    function getCurrentGuName() {
      return guSelect.options[guSelect.selectedIndex]?.text?.trim() || "";

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getAreaListForApt(data, attemptedAptName) {
      const m = data?.areaByApt;
      if (!m || !attemptedAptName) return [];
      const v = String(attemptedAptName).trim();
      if (Array.isArray(m[v]) && m[v].length) return m[v];
      const vn = normalizeDongName(v);
      const key = Object.keys(m).find((k) => {
        const kt = String(k).trim();
        return kt === v || normalizeDongName(k) === vn;
      });
      return key && Array.isArray(m[key]) ? m[key] : [];
    }

    function pickAreaForSlot(areas, fav) {
      const list = Array.isArray(areas) ? areas.map(String) : [];
      const savedRaw = String(fav?.area || "").trim();
      if (!savedRaw) {
        return list.length === 1 ? list[0] : "";
      }
      if (list.includes(savedRaw)) return savedRaw;
      const nf = Math.floor(Number.parseFloat(savedRaw));
      if (Number.isFinite(nf)) {
        const byFloor = list.find((x) => Math.floor(Number.parseFloat(String(x))) === nf);
        if (byFloor != null) return String(byFloor);
      }
      const savedNum = Number.parseFloat(savedRaw);
      if (Number.isFinite(savedNum)) {
        const close = list.find((x) => Math.abs(Number.parseFloat(String(x)) - savedNum) < 0.51);
        if (close != null) return String(close);
      }
      if (list.length === 1) return list[0];
      return "";
    }

    function setSelectValueIfExists(selectEl, value) {
      const want = String(value ?? "").trim();
      if (!want) {
        selectEl.value = "";
        return;
      }
      const opts = [...selectEl.options].filter((o) => o.value !== "");
      if (opts.some((o) => o.value === want)) {
        selectEl.value = want;
        return;
      }
      const wf = Math.floor(Number.parseFloat(want));
      if (Number.isFinite(wf)) {
        const hit = opts.find((o) => Math.floor(Number.parseFloat(o.value)) === wf);
        if (hit) {
          selectEl.value = hit.value;
          return;
        }
      }
      selectEl.value = "";
    }

    function resolvePickToDongOption(rawDong, fixedDongs) {
      const d = String(rawDong || "").trim();
      if (!d) return "";
      if (fixedDongs.includes(d)) return d;
      const key = normalizeDongName(d);
      const found = fixedDongs.find((x) => normalizeDongName(x) === key);
      return found || d;
    }

    function resolvePickToAptOption(rawApt, aptNames) {
      const a = String(rawApt || "").trim();
      if (!a) return "";
      const list = aptNames.map((x) => String(x));
      if (list.includes(a)) return a;
      const hit = list.find((x) => x.trim() === a || normalizeDongName(x) === normalizeDongName(a));
      return hit || a;
    }

    async function applyFavoriteToSlot(slotId, fav) {
      const slot = slots.find((s) => s.id === slotId);
      if (!slot) return;
      suppressGuSelectChange = true;
      slot.aptEl.disabled = true;
      try {
        const targetLawdCd = String(fav.lawdCd || "").trim() || guSelect.value;
        const targetRegionCode = findRegionCodeByLawdCd(targetLawdCd) || regionSelect.value;

        const didDistrictChange = targetLawdCd !== guSelect.value;
        if (targetRegionCode !== regionSelect.value) {
          regionSelect.value = targetRegionCode;
          setupDistrictSelect(targetRegionCode, targetLawdCd);
        }
        if (didDistrictChange) {
          guSelect.value = targetLawdCd;
        }

        const dongOptions = await getDongOptionsByDistrict(targetLawdCd);
        if (didDistrictChange) {
          slots.forEach((s) => {
            renderDongOptions(s.dongEl, dongOptions);
            renderAptOptions(s.aptEl, []);
            renderAreaPlaceholder(s.areaEl, "아파트를 먼저 선택하세요");
          });
        } else {
          renderDongOptions(slot.dongEl, dongOptions);
        }
        const resolvedDong = resolvePickToDongOption(fav.dong, dongOptions);
        if (resolvedDong && ![...slot.dongEl.options].some((o) => o.value === resolvedDong)) {
          const opt = document.createElement("option");
          opt.value = resolvedDong;
          opt.textContent = resolvedDong;
          slot.dongEl.appendChild(opt);
        }
        setSelectValueProgrammatic(slot.dongEl, resolvedDong || "");

        slot.aptEl.innerHTML = '<option value="">불러오는 중...</option>';
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");

        const data = await loadAptAreaOptions({ lawdCd: targetLawdCd, dongName: resolvedDong });
        renderAptOptions(slot.aptEl, data.aptNames);
        const aptWant = String(fav.apt || "").trim();
        const resolvedApt = resolvePickToAptOption(aptWant, data.aptNames);
        if (resolvedApt) {
          if (![...slot.aptEl.options].some((o) => o.value === resolvedApt)) {
            const oa = document.createElement("option");
            oa.value = resolvedApt;
            oa.textContent = resolvedApt;
            slot.aptEl.appendChild(oa);
          }
          setSelectValueProgrammatic(slot.aptEl, resolvedApt);
        } else {
          setSelectValueProgrammatic(slot.aptEl, "");
        }

        const aptName = slot.aptEl.value.trim();
        if (aptName) {
          const areas = getAreaListForApt(data, aptName);
          renderAreaOptions(slot.areaEl, areas);
          const picked = pickAreaForSlot(areas, fav);
          setSelectValueIfExists(slot.areaEl, picked);
        } else {
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
        }
      } catch (err) {
        setMessage(`즐겨찾기 적용 실패(비교${slotId}): ${err.message}`, true);
      } finally {
        slot.aptEl.disabled = false;
        suppressGuSelectChange = false;
      }
    }

    function formatDealTableCompareLabel(p) {
      const apt = String(p.aptName || "").trim();
      const area = String(p.areaFloor || "").trim();
      const parts = [];
      if (apt && apt !== "-") parts.push(apt);
      if (area) parts.push(`${area}㎡`);
      if (!parts.length) {
        const dong = String(p.dongName || "").trim();
        if (dong && dong !== "-") parts.push(dong);
      }
      return parts.join(" ") || "-";
    }

        const cancelPrefix = p.cancelled

          : formatKrw(p.price);
        return (
          `<tr${rowClass}>
          <td class="col-fav"><button type="button" class="${starClass}" data-fav-star="1" data-lawd="${lawdCd}" data-dong="${dongEnc}" data-apt="${aptEnc}" data-area="${areaEnc}" title="찜">${starChar}</button></td>
          <td class="col-date">${p.dateLabel}</td>
          <td class="col-cond">${compareCell}</td>
          <td class="col-price">${priceCell}</td>
          <td class="col-floor">${p.floor}</td>
        </tr>`
        );
      }).join("");

      if (visibleDealCount < allDealPoints.length) {
        loadMoreBtn.style.display = "inline-block";
        loadMoreBtn.textContent = `더 보기 (+${Math.min(TABLE_PAGE_SIZE, allDealPoints.length - visibleDealCount)}건)`;
      } else {
        loadMoreBtn.style.display = "none";
      }
    }

    async function loadData() {
      const lawdCd = guSelect.value;
      const months = Number(monthsSelect.value);
      const conditions = slots
        .map((slot) => {
          const dong = slot.dongEl.value.trim();
          const apt = slot.aptEl.value.trim();
          const area = slot.areaEl.value.trim();
          if (!apt) return null;
          return {
            id: slot.id,
            dong,
            apt,
            area,
            color: slot.color,
            lawdCd,
            guName: getCurrentGuName(),
            label: `비교${slot.id}: ${dong || "동 미지정"} / ${apt}${area ? ` / ${area}㎡` : ""}`
          };
        })
        .filter(Boolean);

      if (!lawdCd) {
        setMessage("지역의 시군구를 선택해주세요.", true);
        return;
      }
      if (conditions.length === 0) {
        setMessage("비교할 아파트를 1개 이상 선택해주세요. (비어있는 입력은 자동 제외됩니다)", true);
        return;
      }

      loadBtn.disabled = true;
      setMessage("데이터 조회 중...");

      try {
        const targetMonths = buildTargetMonths(months);
        const monthlyRows = (await Promise.all(
          targetMonths.map(async (m) => ({
            ym: m.ym,
            items: await fetchOneMonthCached({ lawdCd, ymParam: m.ymParam })
          }))
        ));

        const { labels, datasets } = buildComparisonDatasets(monthlyRows, conditions);
        drawChart(labels, datasets);
        const points = conditions.flatMap((condition) => collectDealPoints(monthlyRows, condition));
        allDealPoints = [...points].sort((a, b) => b.dateLabel.localeCompare(a.dateLabel));
        visibleDealCount = TABLE_PAGE_SIZE;
        await renderDealTable();

        const totalDeals = points.length;
        const guNameResolved = getCurrentGuName() || "선택 지역";
        const selectedLabels = conditions.map((c) => c.label).join(" | ");
        setMessage(`${guNameResolved} / ${selectedLabels} 완료: ${months}개월 조회, 총 거래 ${totalDeals.toLocaleString("ko-KR")}건`);
        if (window.IndexStatePersist?.persistIndexNow) {
          IndexStatePersist.persistIndexNow(() => slots);
        }
      } catch (err) {
        const errText = String(err.message);
        const isUnauthorized = errText.includes("HTTP 401") || errText.includes("HTTP 403");
        const isMissingKey =
          errText.includes("DATA_GO_KR_SERVICE_KEY") || errText.includes("missing_service_key");
        const onVercel = window.location.hostname.endsWith(".vercel.app");
        let hint;
        if (isMissingKey || (onVercel && isUnauthorized)) {
          hint =
            "Vercel → Settings → Environment Variables 에 DATA_GO_KR_SERVICE_KEY 를 넣고 Redeploy 하세요. (국토교통부 활용신청·승인된 일반 인증키)";
        } else if (isUnauthorized) {
          hint =
            "인증 오류(401/403): 국토교통부 '아파트매매 실거래 상세자료' API 활용신청·승인과 DATA_GO_KR_SERVICE_KEY 를 확인해주세요.";
        } else if (onVercel) {
          hint = "Vercel /api/proxy 와 환경변수·네트워크를 점검해주세요.";
        } else {
          hint = "로컬에서는 `npm start` 후 .env 의 DATA_GO_KR_SERVICE_KEY 를 확인해주세요.";
        }
        setMessage(`조회 실패: ${err.message}\n${hint}`, true);
        allDealPoints = [];
        visibleDealCount = TABLE_PAGE_SIZE;
        await renderDealTable();
      } finally {
        loadBtn.disabled = false;
      }
    }

    /* ========================================================================
       비교 슬롯 이벤트 · 초기화
       ======================================================================== */
    function bindSlotEvents(slot) {
      slot.dongEl.addEventListener("change", async () => {
        if (slot.dongEl.dataset.programmatic === "1") return;
        const lawdCd = guSelect.value;
        const dongName = slot.dongEl.value.trim();
        if (!dongName) {
          renderAptOptions(slot.aptEl, []);
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
          return;
        }
        slot.aptEl.disabled = true;
        slot.aptEl.innerHTML = '<option value="">아파트 목록 불러오는 중...</option>';
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
        try {
          const data = await loadAptAreaOptions({ lawdCd, dongName });
          renderAptOptions(slot.aptEl, data.aptNames);
          if (!data.aptNames.length) {
            setMessage(
              `비교${slot.id}: ${dongName}에 조회된 아파트가 없습니다. (최근 24개월 실거래 없음 또는 동명 불일치)`,
              true
            );
          }
        } catch (err) {
          renderAptOptions(slot.aptEl, []);
          setMessage(`비교${slot.id} 아파트 목록 조회 실패: ${err.message}`, true);
        } finally {
          slot.aptEl.disabled = false;
        }
      });

      slot.aptEl.addEventListener("change", async () => {
        if (slot.aptEl.dataset.programmatic === "1") return;
        const lawdCd = guSelect.value;
        const dongName = slot.dongEl.value.trim();
        const aptName = slot.aptEl.value.trim();
        if (!dongName || !aptName) {
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
          return;
        }
        const cacheKey = `${lawdCd}::${dongName}`;
        let data = aptAreaCache[cacheKey];
        if (!data) {
          data = await loadAptAreaOptions({ lawdCd, dongName });
        }
        const areas = getAreaListForApt(data, aptName);
        renderAreaOptions(slot.areaEl, areas);
      });
    }

    regionSelect.addEventListener("change", async () => {
      setupDistrictSelect(regionSelect.value);
      try {
        await loadDongOptionsByDistrict(guSelect.value);
        setMessage("시군구와 동 목록을 불러왔습니다.");
      } catch (err) {
        renderDongLoading("동 목록을 불러오지 못했습니다");
        setMessage(`동 목록 조회 실패: ${err.message}`, true);
      }
    });

    guSelect.addEventListener("change", async () => {
      if (suppressGuSelectChange) return;
      try {
        await loadDongOptionsByDistrict(guSelect.value);
        setMessage("비교 슬롯 동 목록을 불러왔습니다.");
      } catch (err) {
        renderDongLoading("동 목록을 불러오지 못했습니다");
        setMessage(`동 목록 조회 실패: ${err.message}`, true);
      }
    });

    favoritesModalBody.addEventListener("click", async (e) => {
      const notifyBtn = e.target.closest("[data-fav-notify]");
      if (notifyBtn) {
        e.stopPropagation();
        const k = decodeURIComponent(notifyBtn.getAttribute("data-fav-notify") || "");
        const turningOn = notifyBtn.getAttribute("data-notify-on") !== "1";
        try {
          const data = await setFavoriteNotify(k, turningOn);
          await renderManageFavoritesModal();
          if (turningOn && data?.store?.warning) {
            setMessage(data.store.warning, true);
          } else if (turningOn) {
            setMessage("알림이 켜졌습니다. 매일 9:30(한국시간)에 오늘 API에 새로 등록된 실거래가 있으면 카카오톡으로 보냅니다.");
          } else {
            setMessage("알림이 꺼졌습니다.");
          }
        } catch (err) {
          setMessage(`즐겨찾기·알림 저장 실패: ${err.message}`, true);
        }
        return;
      }
      const rm = e.target.closest("[data-fav-remove]");
      if (rm) {
        try {
          await removeFavoriteByKey(decodeURIComponent(rm.getAttribute("data-fav-remove") || ""));
          await renderManageFavoritesModal();
          await renderDealTable();
        } catch (err) {
          setMessage(`즐겨찾기 삭제 실패: ${err.message}`, true);
        }
        return;
      }
      const tg = e.target.closest("[data-fav-modal-toggle]");
      if (tg) {
        const k = decodeURIComponent(tg.getAttribute("data-fav-modal-toggle") || "");
        const list = await readFavorites();
        const f = list.find((x) => favoriteKey(x) === k);
        if (f) {
          try {
            await toggleFavorite(f);
          } catch {
            /* toggleFavorite 에서 메시지 표시 */
          }
        }
        await renderManageFavoritesModal();
        await renderDealTable();
      }
    });

    slotFavModalBody.addEventListener("click", async (e) => {
      const star = e.target.closest("[data-slot-star]");
      if (star) {
        const k = decodeURIComponent(star.getAttribute("data-slot-star") || "");
        const list = await readFavorites();
        const f = list.find((x) => favoriteKey(x) === k);
        if (f) {
          try {
            await toggleFavorite(f);
          } catch {
            /* toggleFavorite 에서 메시지 표시 */
          }
        }
        await renderSlotFavModal();
        await renderDealTable();
        return;
      }
      const row = e.target.closest("[data-fav-pick-key]");
      if (!row || !slotFavTargetId) return;
      const k = decodeURIComponent(row.getAttribute("data-fav-pick-key") || "");
      const list = await readFavorites();
      const fav = list.find((x) => favoriteKey(x) === k);
      if (!fav) return;
      closeAppModal(slotFavModal);
      await applyFavoriteToSlot(slotFavTargetId, fav);
      setMessage(`비교${slotFavTargetId}에 즐겨찾기 단지를 적용했습니다.`);
    });

    dealTableBody.addEventListener("click", (e) => {
      const b = e.target.closest("[data-fav-star]");
      if (!b) return;
      e.preventDefault();
      const lawdCd = b.getAttribute("data-lawd") || guSelect.value;
      const dong = decodeURIComponent(b.getAttribute("data-dong") || "");
      const apt = decodeURIComponent(b.getAttribute("data-apt") || "");
      const area = decodeURIComponent(b.getAttribute("data-area") || "").trim();
      const guName =
        getDistrictName(lawdCd) || getCurrentGuName();
      toggleFavorite({
        lawdCd,
        guName,
        dong,
        apt,
        area
      })
        .then(() => renderDealTable())
        .catch(() => renderDealTable());
    });

    document.getElementById("closeFavoritesModal").addEventListener("click", () => {
      closeAppModal(favoritesModal);
    });

    document.getElementById("closeSlotFavModal").addEventListener("click", () => {
      closeAppModal(slotFavModal);
    });

    favoritesModal.addEventListener("click", (e) => {
      if (e.target === favoritesModal) {
        closeAppModal(favoritesModal);
      }
    });

    slotFavModal.addEventListener("click", (e) => {
      if (e.target === slotFavModal) {
        closeAppModal(slotFavModal);
      }
    });

    slotFavModalBody.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const row = e.target.closest("[data-fav-pick-key]");
      if (!row) return;
      e.preventDefault();
      row.click();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (favoritesModal.classList.contains("open")) {
        closeAppModal(favoritesModal);
      }
      if (slotFavModal.classList.contains("open")) {
        closeAppModal(slotFavModal);
      }
    });

    async function loadAptAreaForSlot(slotId, dongName, aptName = "", areaVal = "") {
      const slot = slots.find((s) => s.id === slotId);
      if (!slot || !dongName) return;
      const lawdCd = guSelect.value;
      slot.aptEl.disabled = true;
      slot.aptEl.innerHTML = '<option value="">아파트 목록 불러오는 중...</option>';
      renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
      try {
        const data = await loadAptAreaOptions({ lawdCd, dongName });
        renderAptOptions(slot.aptEl, data.aptNames);
        const apt = String(aptName || "").trim();
        if (apt) {
          slot.aptEl.value = apt;
          const areas = getAreaListForApt(data, apt);
          renderAreaOptions(slot.areaEl, areas);
          if (areaVal) slot.areaEl.value = String(areaVal);
        }
      } catch {
        renderAptOptions(slot.aptEl, []);
      } finally {
        slot.aptEl.disabled = false;
      }
    }

    (async function bootApp() {
      try {
        API_PROXY_BASE = await resolveApiProxyBase();
      } catch {
        API_PROXY_BASE = (await probeSameOriginApi()) ? "" : VERCEL_API_PROXY_BASE;
      }
      refreshMarketTicker();
      setInterval(refreshMarketTicker, MARKET_REFRESH_MS);

      setupRegionSelect();
      setupDistrictSelect(regionSelect.value);
      setupMonthsSelect();
      initCompareSlots();
      compareSlotsRoot = document.getElementById("compareSlotsRoot");
      addCompareSlotBtn = document.getElementById("addCompareSlotBtn");
      const indexRestoreHint = document.getElementById("indexRestoreHint");
      const setIndexRestoreUi = (active) => {
        if (indexRestoreHint) indexRestoreHint.hidden = !active;
        loadBtn.disabled = active;
      };

      let indexRestored = false;
      const shouldRestoreIndex =
        window.IndexStatePersist?.hasIndexCache?.() ?? false;
      if (shouldRestoreIndex) setIndexRestoreUi(true);

      try {
        if (window.IndexStatePersist) {
          IndexStatePersist.bindIndexPersistence(() => slots);
          indexRestored = await IndexStatePersist.restoreIndexState({
            setupDistrictSelect: (region, gu) => setupDistrictSelect(region, gu),
            loadDongOptionsByDistrict: (lawd) => loadDongOptionsByDistrict(lawd),
            loadAptAreaForSlot,
            setDongForSlot: (slotId, dongName) => {
              const slot = slots.find((s) => s.id === Number(slotId));
              if (slot?.dongEl && dongName) {
                setSelectValueProgrammatic(slot.dongEl, dongName);
              }
            },
            ensureSlotCount: async (slotRows) => {
              const rows = (slotRows || []).filter(
                (r) => r && (r.dong || r.apt || r.area)
              );
              const maxId = Math.max(1, 0, ...rows.map((r) => Number(r.id) || 0));
              while (slots.length < maxId && slots.length < MAX_COMPARE_SLOTS) {
                addCompareSlot({ syncDong: false });
              }
            }
          });
        }

        if (!indexRestored) {
          try {
            await loadDongOptionsByDistrict(guSelect.value);
          } catch (err) {
            renderDongLoading("동 목록을 불러오지 못했습니다");
            setMessage(`동 목록 조회 실패: ${err.message}`, true);
          }
        }
      } finally {
        setIndexRestoreUi(false);
      }

      loadMoreBtn.addEventListener("click", () => {
        visibleDealCount += TABLE_PAGE_SIZE;
        void renderDealTable();
      });
      loadBtn.addEventListener("click", loadData);
    })();
  </script>
</body>
</html>
