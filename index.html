<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아파트 실거래가 월별 시세 변동</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111111;
      --muted: #4b5563;
      --primary: #2563eb;
      --border: #d1d5db;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p.desc {
      margin: 0;
      color: var(--text);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }
    .common-section {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .common-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .compare-wrap {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .compare-card {
      border-radius: 10px; 
      padding: 12px;
      border: 1px solid var(--border);
    }
    .compare-card.c1 {
      background: #eff6ff;
      border-color: #bfdbfe;
    }
    .compare-card.c2 {
      background: #fef2f2;
      border-color: #fecaca;
    }
    .compare-card.c3 {
      background: #ecfdf5;
      border-color: #bbf7d0;
    }
    .compare-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .compare-card-head .section-title {
      margin: 0;
    }
    .compare-card-head .btn-link {
      margin-top: 0;
      flex-shrink: 0;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    input, select, option, button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      width: 100%;
      color: var(--text);
    }
    button {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      border: none;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .full {
      grid-column: 1 / -1;
    }
    #message {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text);
      white-space: pre-wrap;
    }
    #message.error { color: var(--danger); }
    .hint {
      font-size: 13px;
      color: var(--text);
      margin-top: 8px;
      line-height: 1.5;
    }
    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f9fafb;
      font-weight: 700;
    }
    .empty-row {
      color: var(--text);
    }
    .table-actions {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .compare-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid transparent;
    }
    #loadMoreBtn {
      width: auto;
      padding: 8px 16px;
      margin-top: 0;
      background: #374151;
    }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .page-header-text { flex: 1; min-width: 200px; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .market-ticker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .market-ticker-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .market-ticker-item strong { font-weight: 700; }
    .market-ticker-item .up { color: #b91c1c; font-weight: 600; }
    .market-ticker-item .down { color: #1d4ed8; font-weight: 600; }
    .market-ticker-item .muted { color: var(--muted); font-size: 12px; }
    .notify-btn {
      background: transparent;
      border: none;
      margin: 0;
      padding: 2px 6px;
      width: auto;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.35;
      filter: grayscale(1);
    }
    .notify-btn.on {
      opacity: 1;
      filter: none;
    }
    .notify-btn:hover { opacity: 0.75; }
    .notify-btn.on:hover { opacity: 1; }
    .notify-hint {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-top: 0;
      width: auto;
      padding: 8px 14px;
      font-size: 13px;
    }
    .btn-secondary:hover { background: #eff6ff; }
    .btn-link {
      background: transparent;
      color: var(--primary);
      border: none;
      margin-top: 4px;
      padding: 4px 0;
      width: auto;
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .btn-link:hover { color: #1d4ed8; }
    .star-btn {
      background: transparent;
      border: none;
      margin: 0;
      padding: 2px 6px;
      width: auto;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: #9ca3af;
    }
    .star-btn.filled {
      color: #f59e0b;
    }
    .star-btn:hover { opacity: 0.85; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 520px;
      width: 100%;
      max-height: min(80vh, 560px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }
    .modal-close {
      background: #f3f4f6;
      color: var(--text);
      border: none;
      margin: 0;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      font-weight: 700;
    }
    .modal-close:hover { background: #e5e7eb; }
    .modal-body {
      padding: 12px 16px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .fav-empty {
      text-align: center;
      color: var(--text);
      padding: 28px 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .fav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .fav-row-main {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.45;
    }
    .fav-row-title { font-weight: 700; color: var(--text); }
    .fav-row-meta { color: var(--text); font-size: 12px; margin-top: 2px; }
    .btn-remove-fav {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
      margin: 0;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-remove-fav:hover { background: #fecaca; }
    .fav-row.pickable { cursor: pointer; }
    .fav-row.pickable:hover { background: #eff6ff; border-color: #bfdbfe; }
    @media (max-width: 900px) {
      .compare-wrap { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .common-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      body { background: #fff; }
      .container {
        margin: 0 auto;
        padding: 10px;
      }
      .card {
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 10px;
        box-shadow: none;
      }
      h1 {
        font-size: 20px;
        line-height: 1.25;
      }
      p.desc,
      .hint,
      #message {
        font-size: 13px;
        line-height: 1.45;
      }
      input, select, option, button {
        min-height: 44px;
        font-size: 16px;
      }
      .page-header,
      .header-actions,
      .btn-secondary {
        width: 100%;
      }
      .common-section,
      .compare-card {
        padding: 10px;
      }
      .compare-card-head {
        align-items: flex-start;
      }
      .compare-card-head .btn-link {
        font-size: 14px;
        padding: 2px 0;
      }
      #priceChart {
        min-height: 260px;
      }
      .table-wrap {
        overflow-x: visible;
      }
      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }
      thead {
        display: none;
      }
      tbody tr {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 10px;
        margin-bottom: 10px;
        background: #fff;
      }
      tbody tr.empty-row {
        padding: 16px;
        text-align: center;
      }
      td {
        border-bottom: 1px solid #edf0f3;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        padding: 9px 0;
        white-space: normal;
        word-break: keep-all;
        text-align: right;
      }
      td:last-child {
        border-bottom: none;
      }
      td::before {
        content: attr(data-label);
        flex: 0 0 86px;
        color: #374151;
        font-weight: 800;
        text-align: left;
      }
      td[data-label="즐겨찾기"] {
        justify-content: flex-start;
        align-items: center;
      }
      td[data-label="즐겨찾기"]::before {
        flex: 0 0 86px;
      }
      .compare-tag {
        white-space: normal;
        text-align: left;
        line-height: 1.35;
      }
      #loadMoreBtn {
        width: 100%;
        min-height: 44px;
      }
      .modal-overlay {
        padding: 8px;
        align-items: flex-end;
      }
      .modal-panel {
        max-height: 88vh;
        border-radius: 14px 14px 0 0;
      }
      .modal-head,
      .modal-body {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
    @media (max-width: 420px) {
      .container { padding: 8px; }
      .card { padding: 10px; }
      h1 { font-size: 18px; }
      .section-title { font-size: 14px; }
      td::before,
      td[data-label="즐겨찾기"]::before {
        flex-basis: 74px;
      }
      .fav-row {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-header-text">
          <h1>아파트 실거래가 월별 시세 변동</h1>
          <p class="desc">공공데이터포털(국토교통부 아파트 매매 실거래자료) API 기반 월별 평균 거래금액 차트</p>
          <div id="marketTicker" class="market-ticker" aria-live="polite">
            <span class="market-ticker-item" id="fxTicker">
              <strong>USD/KRW</strong> <span class="muted">불러오는 중…</span>
            </span>
            <span class="market-ticker-item" id="kbTicker">
              <strong>KB금융</strong> <span class="muted">불러오는 중…</span>
            </span>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-secondary" id="openFavoritesBtn">즐겨찾기 보기</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="common-section">
        <p class="section-title">공통 조회 조건</p>
        <div class="common-grid">
          <div class="field">
            <label for="regionSelect">시/도</label>
            <select id="regionSelect"></select>
          </div>
          <div class="field">
            <label for="guSelect" id="districtLabel">시군구</label>
            <select id="guSelect"></select>
          </div>
          <div class="field">
            <label for="months">조회 개월 수</label>
            <select id="months"></select>
          </div>
        </div>
      </div>

      <div class="compare-wrap">
        <div class="compare-card c1">
          <div class="compare-card-head">
            <p class="section-title">비교 1</p>
            <button type="button" class="btn-link" data-fav-pick-slot="1">즐겨찾기에서 선택</button>
          </div>
          <div class="compare-grid">
            <div class="field">
              <label for="dongSelect1">동</label>
              <select id="dongSelect1"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="aptSelect1">아파트</label>
              <select id="aptSelect1"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="areaSelect1">평형</label>
              <select id="areaSelect1"><option value="">전체</option></select>
            </div>
          </div>
        </div>

        <div class="compare-card c2">
          <div class="compare-card-head">
            <p class="section-title">비교 2</p>
            <button type="button" class="btn-link" data-fav-pick-slot="2">즐겨찾기에서 선택</button>
          </div>
          <div class="compare-grid">
            <div class="field">
              <label for="dongSelect2">동</label>
              <select id="dongSelect2"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="aptSelect2">아파트</label>
              <select id="aptSelect2"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="areaSelect2">평형</label>
              <select id="areaSelect2"><option value="">전체</option></select>
            </div>
          </div>
        </div>

        <div class="compare-card c3">
          <div class="compare-card-head">
            <p class="section-title">비교 3</p>
            <button type="button" class="btn-link" data-fav-pick-slot="3">즐겨찾기에서 선택</button>
          </div>
          <div class="compare-grid">
            <div class="field">
              <label for="dongSelect3">동</label>
              <select id="dongSelect3"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="aptSelect3">아파트</label>
              <select id="aptSelect3"><option value="">선택 안함</option></select>
            </div>
            <div class="field">
              <label for="areaSelect3">평형</label>
              <select id="areaSelect3"><option value="">전체</option></select>
            </div>
          </div>
        </div>
      </div>

      <div class="field full">
        <button id="loadBtn">차트 조회</button>
        <div id="message">지역 선택 후 비교1~3의 동/아파트/평형을 설정하세요.</div>
        <div class="hint">
          - 아파트를 선택하면 해당 아파트의 평형만 표시됩니다.<br />
       </div>
      </div>
    </div>

    <div class="card">
      <canvas id="priceChart" height="120"></canvas>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:44px;">즐겨찾기</th>
              <th>거래일</th>
              <th>비교조건</th>
              <th>동</th>
              <th>실거래가</th>
              <th>층</th>
              <th>호수</th>
            </tr>
          </thead>
          <tbody id="dealTableBody">
            <tr class="empty-row"><td colspan="7">조회하면 최근 10건이 표시됩니다.</td></tr>
          </tbody>
        </table>
        <div class="table-actions">
          <button id="loadMoreBtn" type="button" style="display:none;">더 보기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="favoritesModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-labelledby="favoritesModalTitle">
      <div class="modal-head">
        <h2 id="favoritesModalTitle">즐겨찾기</h2>
        <button type="button" class="modal-close" id="closeFavoritesModal" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="favoritesModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="slotFavModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-labelledby="slotFavModalTitle">
      <div class="modal-head">
        <h2 id="slotFavModalTitle">즐겨찾기에서 선택</h2>
        <button type="button" class="modal-close" id="closeSlotFavModal" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="slotFavModalBody"></div>
    </div>
  </div>

  <script>
    const API_PROXY_ROUTES = [
      { target: "trade-dev", label: "개발" },
      { target: "trade", label: "운영" }
    ];
    const VERCEL_API_PROXY_BASE = "https://apt-compare-beta.vercel.app";
    const API_PROXY_BASE = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? ""
      : VERCEL_API_PROXY_BASE;
    const REGION_OPTIONS = [
      { code: "seoul", name: "서울특별시", districtLabel: "서울 구" },
      { code: "incheon", name: "인천광역시", districtLabel: "구/군" },
      { code: "gyeonggi", name: "경기도", districtLabel: "시군구" }
    ];
    const SEOUL_GU_OPTIONS = [
      { code: "11110", name: "종로구" }, { code: "11140", name: "중구" }, { code: "11170", name: "용산구" },
      { code: "11200", name: "성동구" }, { code: "11215", name: "광진구" }, { code: "11230", name: "동대문구" },
      { code: "11260", name: "중랑구" }, { code: "11290", name: "성북구" }, { code: "11305", name: "강북구" },
      { code: "11320", name: "도봉구" }, { code: "11350", name: "노원구" }, { code: "11380", name: "은평구" },
      { code: "11410", name: "서대문구" }, { code: "11440", name: "마포구" }, { code: "11470", name: "양천구" },
      { code: "11500", name: "강서구" }, { code: "11530", name: "구로구" }, { code: "11545", name: "금천구" },
      { code: "11560", name: "영등포구" }, { code: "11590", name: "동작구" }, { code: "11620", name: "관악구" },
      { code: "11650", name: "서초구" }, { code: "11680", name: "강남구" }, { code: "11710", name: "송파구" },
      { code: "11740", name: "강동구" }

    function ymToString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `${y}${m}`;
    }

    function formatKrw(value) {
      return Number(value).toLocaleString("ko-KR") + "만원";
    }

    function parseDealAmount(amountText) {
      return Number(String(amountText).replaceAll(",", "").trim());
    }

    function normalizeDongName(name) {
      return String(name || "").replaceAll(" ", "").trim();
    }

    function toDongKey(name) {
      return normalizeDongName(name).replace(/\d+동$/u, "동");
    }

    function isSameDong(itemDongName, selectedDongName) {
      const itemKey = toDongKey(itemDongName);
      const selectedKey = toDongKey(selectedDongName);
      return Boolean(itemKey) && Boolean(selectedKey) && itemKey === selectedKey;
    }

    function getDongName(item) {
      return String(
        item?.umdNm ??
        item?.UMD_NM ??
        item?.umd_nm ??
        item?.dong ??
        item?.DONG ??
        item?.법정동 ??
        ""
      ).trim();
    }

    function setSelectValueProgrammatic(selectEl, value) {
      if (!selectEl) return;
      selectEl.dataset.programmatic = "1";
      try {
        selectEl.value = value == null ? "" : String(value);
      } finally {
        queueMicrotask(() => {
          delete selectEl.dataset.programmatic;
        });
      }
    }

    function itemMatchesSelectedDong(item, dongName) {
      if (!dongName) return true;
      const itemDong = getDongName(item);
      if (!itemDong) return false;
      if (isSameDong(itemDong, dongName)) return true;
      return normalizeDongName(itemDong) === normalizeDongName(dongName);
    }

    function getAptName(item) {
      return String(item?.aptNm || item?.apartment || item?.아파트 || "").trim();
    }

    function getAreaValue(item) {
      const raw = item?.excluUseAr || item?.exclusiveArea || item?.전용면적;
      const n = Number.parseFloat(String(raw ?? "").replaceAll(",", "").trim());
      return Number.isFinite(n) ? n : null;
    }

    function getAreaFloorValue(item) {
      const area = getAreaValue(item);
      if (area == null) return null;
      return Math.floor(area);
    }

    function getDealDateLabel(item, fallbackYm) {
      const y = String(item?.dealYear || "").trim();
      const m = String(item?.dealMonth || "").trim().padStart(2, "0");
      const d = String(item?.dealDay || "").trim().padStart(2, "0");
      if (y && m && d) return `${y}-${m}-${d}`;
      return `${fallbackYm}-01`;
    }

    function buildTargetMonths(monthCount) {
      const result = [];
      const cursor = new Date();
      cursor.setDate(1);
      for (let i = monthCount - 1; i >= 0; i--) {
        const d = new Date(cursor.getFullYear(), cursor.getMonth() - i, 1);
        result.push({
          ym: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
          ymParam: ymToString(d)
        });
      }
      return result;
    }

    async function fetchOneMonth({ lawdCd, ymParam }) {
      let lastError;

      for (const route of API_PROXY_ROUTES) {
        try {
          const params = new URLSearchParams({
            target: route.target,
            LAWD_CD: lawdCd,
            DEAL_YMD: ymParam,
            pageNo: "1",
            numOfRows: "1000",
            _type: "json"
          });
          const url = `${API_PROXY_BASE}/api/proxy?${params.toString()}`;
          const res = await fetch(url);
          if (!res.ok) {
            let detail = "";
            try {
              const errBody = await res.clone().json();
              if (errBody?.message) detail = `: ${errBody.message}`;
            } catch {
              /* ignore */
            }
            throw new Error(`HTTP ${res.status} (${route.label} 프록시)${detail}`);
          }

          const data = await res.json();
          const header = data?.response?.header;
          const resultCode = String(header?.resultCode ?? "");
          const isSuccess = resultCode === "00" || resultCode === "000";
          if (!isSuccess) {
            throw new Error(
              `${header?.resultMsg || "API 오류"} (코드: ${resultCode || "N/A"}, ${route.label} 엔드포인트)`
            );
          }
          const items = data?.response?.body?.items?.item || [];
          return Array.isArray(items) ? items : [items];
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("알 수 없는 API 오류");
    }

    function fetchOneMonthCached({ lawdCd, ymParam }) {
      const key = `${lawdCd}::${ymParam}`;
      if (!monthDataPromiseCache[key]) {
        monthDataPromiseCache[key] = fetchOneMonth({ lawdCd, ymParam })
          .catch((err) => {
            delete monthDataPromiseCache[key];
            throw err;
          });
      }
      return monthDataPromiseCache[key];
    }

    function collectDealPoints(monthlyRows, condition) {
      const points = [];
      for (const { ym, items } of monthlyRows) {
        for (const it of items) {
          if (condition.dong && !itemMatchesSelectedDong(it, condition.dong)) continue;
          if (condition.apt && getAptName(it) !== condition.apt) continue;
          if (condition.area) {
            const area = getAreaFloorValue(it);
            if (area == null || String(area) !== condition.area) continue;
          }

          const price = parseDealAmount(it.dealAmount);
          if (!Number.isFinite(price) || price <= 0) continue;
          const rawDong = String(getDongName(it) || "").trim();
          const fallbackDong = String(condition.dong || "").trim();
          const af = getAreaFloorValue(it);
          points.push({
            dateLabel: getDealDateLabel(it, ym),
            price,
            aptName: getAptName(it) || "-",
            dongName: rawDong || fallbackDong || "-",
            areaFloor: af != null ? String(af) : "",
            hoName: getHoName(it) || "-",
            floor: getFloor(it) || "-",
            lineLabel: condition.label,
            lineColor: condition.color,
            lawdCd: condition.lawdCd
          });
        }
      }

      points.sort((a, b) => a.dateLabel.localeCompare(b.dateLabel));
      return points;
    }

    function getStaticDongOptions(lawdCd) {
      return Array.isArray(SEOUL_DONGS_BY_GU[lawdCd]) ? SEOUL_DONGS_BY_GU[lawdCd] : [];

    async function getDongOptionsByDistrict(lawdCd) {
      const fixedDongs = getStaticDongOptions(lawdCd);
      if (fixedDongs.length) return fixedDongs;

      const key = String(lawdCd || "");
      if (!dongOptionsPromiseCache[key]) {
        dongOptionsPromiseCache[key] = (async () => {
          const targetMonths = buildTargetMonths(24);
          const monthResults = await Promise.allSettled(
            targetMonths.map((m) => fetchOneMonthCached({ lawdCd, ymParam: m.ymParam }))
          );
          const fulfilled = monthResults.filter((r) => r.status === "fulfilled");
          if (!fulfilled.length) {
            const rej = monthResults.find((r) => r.status === "rejected");
            const msg = rej?.reason?.message || String(rej?.reason || "") || "동 목록 API 호출이 모두 실패했습니다.";
            throw new Error(msg);
          }

          const dongSet = new Set();
          for (const result of fulfilled) {
            for (const item of result.value) {
              const dongName = getDongName(item);
              if (dongName) dongSet.add(dongName);
            }
          }
          return sortStringsKoAsc(Array.from(dongSet));
        })().catch((err) => {
          delete dongOptionsPromiseCache[key];
          throw err;
        });
      }
      return dongOptionsPromiseCache[key];
    }

    async function loadDongOptionsByDistrict(lawdCd) {

      const dongNames = await getDongOptionsByDistrict(lawdCd);
      slots.forEach((slot) => {

        renderAptOptions(slot.aptEl, []);
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
      });
      return dongNames;
    }

    async function loadAptAreaOptions({ lawdCd, dongName }) {
      const key = `${lawdCd}::${dongName}`;
      if (aptAreaCache[key]) {
        return aptAreaCache[key];
      }

      const targetMonths = buildTargetMonths(24);
      const aptSet = new Set();
      const areaByAptSet = {};
      const monthResults = await Promise.allSettled(
        targetMonths.map((m) => fetchOneMonthCached({ lawdCd, ymParam: m.ymParam }))
      );
      const fulfilled = monthResults.filter((r) => r.status === "fulfilled");
      if (fulfilled.length === 0) {
        const rej = monthResults.find((r) => r.status === "rejected");
        const msg = rej?.reason?.message || String(rej?.reason || "") || "월별 API 호출이 모두 실패했습니다.";
        throw new Error(msg);
      }
      for (const result of monthResults) {
        if (result.status !== "fulfilled") continue;
        const items = result.value;
        for (const item of items) {
          if (!itemMatchesSelectedDong(item, dongName)) continue;
          const aptName = getAptName(item);
          if (!aptName) continue;
          aptSet.add(aptName);
          if (!areaByAptSet[aptName]) areaByAptSet[aptName] = new Set();
            const area = getAreaFloorValue(item);
          if (area != null) areaByAptSet[aptName].add(String(area));
        }
      }

      const aptNames = sortStringsKoAsc(Array.from(aptSet));
      const areaByApt = {};
      for (const aptName of aptNames) {
        areaByApt[aptName] = sortAreaM2Asc(Array.from(areaByAptSet[aptName] || []));
      }
      aptAreaCache[key] = { aptNames, areaByApt };
      return aptAreaCache[key];
    }

    function buildComparisonDatasets(monthlyRows, conditions) {
      const labels = monthlyRows.map((row) => row.ym);
      const datasets = conditions.map((condition) => {
        const data = monthlyRows.map(({ items }) => {
          const prices = items
            .filter((it) => !condition.dong || itemMatchesSelectedDong(it, condition.dong))
            .filter((it) => getAptName(it) === condition.apt)
            .filter((it) => {
              if (!condition.area) return true;
              const area = getAreaFloorValue(it);
              return area != null && String(area) === condition.area;
            })
            .map((it) => parseDealAmount(it.dealAmount))
            .filter((n) => Number.isFinite(n) && n > 0);
          if (!prices.length) return null;
          return Math.round(prices.reduce((sum, n) => sum + n, 0) / prices.length);
        });

        return {
          label: condition.label,
          data,
          borderColor: condition.color,
          backgroundColor: `${condition.color}33`,
          fill: false,
          tension: 0.2,
          spanGaps: true,
          pointRadius: 3,
          showLine: true
        };
      });

      return { labels, datasets };
    }

    function drawChart(labels, datasets) {
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("priceChart"), {
        type: "line",
        data: {
          labels,
          datasets
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: {
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  if (ctx.raw == null) return "거래 데이터 없음";
                  return `${ctx.dataset.label}: ${formatKrw(ctx.raw)}`;
                }
              }
            }
          },
          scales: {
            y: {
              ticks: {
                callback: (v) => Number(v).toLocaleString("ko-KR")
              }
            }
          }
        }
      });
    }

    function readFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        const list = Array.isArray(parsed) ? parsed : [];
        return list.map((e) => ({
          lawdCd: String(e?.lawdCd ?? "").trim(),
          guName: String(e?.guName ?? "").trim(),
          dong: String(e?.dong ?? "").trim(),
          apt: String(e?.apt ?? "").trim(),
          area: e?.area != null && String(e.area).trim() !== "" ? String(e.area).trim() : "",
          notify: Boolean(e?.notify)
        }));
      } catch {
        return [];
      }
    }

    function writeFavorites(list) {
      localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(list));
    }

    function favoriteKey(entry) {
      const lawdCd = String(entry?.lawdCd ?? "").trim();
      const dong = normalizeDongName(entry.dong);
      const apt = String(entry?.apt ?? "").trim();
      const area = String(entry?.area ?? "").trim();
      const base = `${lawdCd}|${dong}|${apt}`;
      if (!area) {
        return base;
      }
      return `${base}|${area}`;
    }

    function isFavoriteEntry(entry) {
      const k = favoriteKey(entry);
      return readFavorites().some((e) => favoriteKey(e) === k);
    }

    function toggleFavorite(entry) {
      const list = readFavorites();
      const k = favoriteKey(entry);
      const idx = list.findIndex((e) => favoriteKey(e) === k);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.push({
          lawdCd: entry.lawdCd,
          guName: String(entry.guName || "").trim(),
          dong: String(entry.dong || "").trim(),
          apt: String(entry.apt || "").trim(),
          area: entry.area != null && String(entry.area).trim() !== "" ? String(entry.area).trim() : "",
          notify: Boolean(entry.notify)
        });
      }
      writeFavorites(list);
    }

    function removeFavoriteByKey(key) {
      writeFavorites(readFavorites().filter((e) => favoriteKey(e) !== key));
      syncNotifySubscriptions().catch(() => {});
    }

    function setFavoriteNotify(key, enabled) {
      const list = readFavorites();
      const idx = list.findIndex((e) => favoriteKey(e) === key);
      if (idx < 0) return;
      list[idx].notify = Boolean(enabled);
      writeFavorites(list);
      syncNotifySubscriptions().catch(() => {});
    }

    async function syncNotifySubscriptions() {
      const subs = readFavorites().filter((f) => f.notify);
      try {
        const res = await fetch(`${API_PROXY_BASE}/api/notifications`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subscriptions: subs })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.message || `HTTP ${res.status}`);
        }
        if (data?.store?.warning) {
          console.warn("[notify sync]", data.store.warning);
        }
        return data;
      } catch (err) {
        console.warn("[notify sync failed]", err.message);
        throw err;
      }
    }

      const sign = n > 0 ? "+" : "";

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getAreaListForApt(data, attemptedAptName) {
      const m = data?.areaByApt;
      if (!m || !attemptedAptName) return [];
      const v = String(attemptedAptName).trim();
      if (Array.isArray(m[v]) && m[v].length) return m[v];
      const vn = normalizeDongName(v);
      const key = Object.keys(m).find((k) => {
        const kt = String(k).trim();
        return kt === v || normalizeDongName(k) === vn;
      });
      return key && Array.isArray(m[key]) ? m[key] : [];
    }

    function pickAreaForSlot(areas, fav) {
      const list = Array.isArray(areas) ? areas.map(String) : [];
      const savedRaw = String(fav?.area || "").trim();
      if (!savedRaw) {
        return list.length === 1 ? list[0] : "";
      }
      if (list.includes(savedRaw)) return savedRaw;
      const nf = Math.floor(Number.parseFloat(savedRaw));
      if (Number.isFinite(nf)) {
        const byFloor = list.find((x) => Math.floor(Number.parseFloat(String(x))) === nf);
        if (byFloor != null) return String(byFloor);
      }
      const savedNum = Number.parseFloat(savedRaw);
      if (Number.isFinite(savedNum)) {
        const close = list.find((x) => Math.abs(Number.parseFloat(String(x)) - savedNum) < 0.51);
        if (close != null) return String(close);
      }
      if (list.length === 1) return list[0];
      return "";
    }

    function setSelectValueIfExists(selectEl, value) {
      const want = String(value ?? "").trim();
      if (!want) {
        selectEl.value = "";
        return;
      }
      const opts = [...selectEl.options].filter((o) => o.value !== "");
      if (opts.some((o) => o.value === want)) {
        selectEl.value = want;
        return;
      }
      const wf = Math.floor(Number.parseFloat(want));
      if (Number.isFinite(wf)) {
        const hit = opts.find((o) => Math.floor(Number.parseFloat(o.value)) === wf);
        if (hit) {
          selectEl.value = hit.value;
          return;
        }
      }
      selectEl.value = "";
    }

    function resolvePickToDongOption(rawDong, fixedDongs) {
      const d = String(rawDong || "").trim();
      if (!d) return "";
      if (fixedDongs.includes(d)) return d;
      const key = normalizeDongName(d);
      const found = fixedDongs.find((x) => normalizeDongName(x) === key);
      return found || d;
    }

    function resolvePickToAptOption(rawApt, aptNames) {
      const a = String(rawApt || "").trim();
      if (!a) return "";
      const list = aptNames.map((x) => String(x));
      if (list.includes(a)) return a;
      const hit = list.find((x) => x.trim() === a || normalizeDongName(x) === normalizeDongName(a));
      return hit || a;
    }

    async function applyFavoriteToSlot(slotId, fav) {
      const slot = slots.find((s) => s.id === slotId);
      if (!slot) return;
      suppressGuSelectChange = true;
      slot.aptEl.disabled = true;
      try {
        const targetLawdCd = String(fav.lawdCd || "").trim() || guSelect.value;
        const targetRegionCode = findRegionCodeByLawdCd(targetLawdCd) || regionSelect.value;

        const didDistrictChange = targetLawdCd !== guSelect.value;
        if (targetRegionCode !== regionSelect.value) {
          regionSelect.value = targetRegionCode;
          setupDistrictSelect(targetRegionCode, targetLawdCd);
        }
        if (didDistrictChange) {
          guSelect.value = targetLawdCd;
        }

        const dongOptions = await getDongOptionsByDistrict(targetLawdCd);
        if (didDistrictChange) {
          slots.forEach((s) => {
            renderDongOptions(s.dongEl, dongOptions);
            renderAptOptions(s.aptEl, []);
            renderAreaPlaceholder(s.areaEl, "아파트를 먼저 선택하세요");
          });
        } else {
          renderDongOptions(slot.dongEl, dongOptions);
        }
        const resolvedDong = resolvePickToDongOption(fav.dong, dongOptions);
        if (resolvedDong && ![...slot.dongEl.options].some((o) => o.value === resolvedDong)) {
          const opt = document.createElement("option");
          opt.value = resolvedDong;
          opt.textContent = resolvedDong;
          slot.dongEl.appendChild(opt);
        }
        setSelectValueProgrammatic(slot.dongEl, resolvedDong || "");

        slot.aptEl.innerHTML = '<option value="">불러오는 중...</option>';
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");

        const data = await loadAptAreaOptions({ lawdCd: targetLawdCd, dongName: resolvedDong });
        renderAptOptions(slot.aptEl, data.aptNames);
        const aptWant = String(fav.apt || "").trim();
        const resolvedApt = resolvePickToAptOption(aptWant, data.aptNames);
        if (resolvedApt) {
          if (![...slot.aptEl.options].some((o) => o.value === resolvedApt)) {
            const oa = document.createElement("option");
            oa.value = resolvedApt;
            oa.textContent = resolvedApt;
            slot.aptEl.appendChild(oa);
          }
          setSelectValueProgrammatic(slot.aptEl, resolvedApt);
        } else {
          setSelectValueProgrammatic(slot.aptEl, "");
        }

        const aptName = slot.aptEl.value.trim();
        if (aptName) {
          const areas = getAreaListForApt(data, aptName);
          renderAreaOptions(slot.areaEl, areas);
          const picked = pickAreaForSlot(areas, fav);
          setSelectValueIfExists(slot.areaEl, picked);
        } else {
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
        }
      } catch (err) {
        setMessage(`즐겨찾기 적용 실패(비교${slotId}): ${err.message}`, true);
      } finally {
        slot.aptEl.disabled = false;
        suppressGuSelectChange = false;
      }
    }

    async function loadData() {
      const lawdCd = guSelect.value;
      const months = Number(monthsSelect.value);
      const conditions = slots
        .map((slot) => {
          const dong = slot.dongEl.value.trim();
          const apt = slot.aptEl.value.trim();
          const area = slot.areaEl.value.trim();
          if (!apt) return null;
          return {
            id: slot.id,
            dong,
            apt,
            area,
            color: slot.color,
            lawdCd,
            guName: getCurrentGuName(),
            label: `비교${slot.id}: ${dong || "동 미지정"} / ${apt}${area ? ` / ${area}㎡` : ""}`
          };
        })
        .filter(Boolean);

      if (!lawdCd) {
        setMessage("지역의 시군구를 선택해주세요.", true);
        return;
      }
      if (conditions.length === 0) {
        setMessage("비교할 아파트를 1개 이상 선택해주세요. (비어있는 입력은 자동 제외됩니다)", true);
        return;
      }

      loadBtn.disabled = true;
      setMessage("데이터 조회 중...");

      try {
        const targetMonths = buildTargetMonths(months);
        const monthlyRows = (await Promise.all(
          targetMonths.map(async (m) => ({
            ym: m.ym,
            items: await fetchOneMonthCached({ lawdCd, ymParam: m.ymParam })
          }))
        ));

        const { labels, datasets } = buildComparisonDatasets(monthlyRows, conditions);
        drawChart(labels, datasets);
        const points = conditions.flatMap((condition) => collectDealPoints(monthlyRows, condition));
        allDealPoints = [...points].sort((a, b) => b.dateLabel.localeCompare(a.dateLabel));
        visibleDealCount = TABLE_PAGE_SIZE;
        renderDealTable();

        const totalDeals = points.length;
        const guNameResolved = getCurrentGuName() || "선택 지역";
        const selectedLabels = conditions.map((c) => c.label).join(" | ");
        setMessage(`${guNameResolved} / ${selectedLabels} 완료: ${months}개월 조회, 총 거래 ${totalDeals.toLocaleString("ko-KR")}건`);
      } catch (err) {
        const isUnauthorized = String(err.message).includes("HTTP 401");
        setMessage(
          `조회 실패: ${err.message}\n` +
          (
            isUnauthorized
              ? "401 인증 오류: 1) 해당 API 활용신청/승인 여부 2) .env 의 DATA_GO_KR_SERVICE_KEY(일반/디코딩) 3) 계정의 호출 권한을 확인해주세요."
              : "로컬에서는 `npm start` 로 서버 실행 후 접속했는지, .env 키 설정·네트워크를 점검해주세요."
          ),
          true
        );
        allDealPoints = [];
        visibleDealCount = TABLE_PAGE_SIZE;
        renderDealTable();
      } finally {
        loadBtn.disabled = false;
      }
    }

    function bindSlotEvents(slot) {
      slot.dongEl.addEventListener("change", async () => {
        if (slot.dongEl.dataset.programmatic === "1") return;
        const lawdCd = guSelect.value;
        const dongName = slot.dongEl.value.trim();
        if (!dongName) {
          renderAptOptions(slot.aptEl, []);
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
          return;
        }
        slot.aptEl.disabled = true;
        slot.aptEl.innerHTML = '<option value="">아파트 목록 불러오는 중...</option>';
        renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
        try {
          const data = await loadAptAreaOptions({ lawdCd, dongName });
          renderAptOptions(slot.aptEl, data.aptNames);
        } catch (err) {
          renderAptOptions(slot.aptEl, []);
          setMessage(`비교${slot.id} 아파트 목록 조회 실패: ${err.message}`, true);
        } finally {
          slot.aptEl.disabled = false;
        }
      });

      slot.aptEl.addEventListener("change", async () => {
        if (slot.aptEl.dataset.programmatic === "1") return;
        const lawdCd = guSelect.value;
        const dongName = slot.dongEl.value.trim();
        const aptName = slot.aptEl.value.trim();
        if (!dongName || !aptName) {
          renderAreaPlaceholder(slot.areaEl, "아파트를 먼저 선택하세요");
          return;
        }
        const cacheKey = `${lawdCd}::${dongName}`;
        let data = aptAreaCache[cacheKey];
        if (!data) {
          data = await loadAptAreaOptions({ lawdCd, dongName });
        }
        const areas = getAreaListForApt(data, aptName);
        renderAreaOptions(slot.areaEl, areas);
      });
    }

    regionSelect.addEventListener("change", async () => {
      setupDistrictSelect(regionSelect.value);
      try {
        await loadDongOptionsByDistrict(guSelect.value);
        setMessage("시군구와 동 목록을 불러왔습니다.");
      } catch (err) {
        renderDongLoading("동 목록을 불러오지 못했습니다");
        setMessage(`동 목록 조회 실패: ${err.message}`, true);
      }
    });

    guSelect.addEventListener("change", async () => {
      if (suppressGuSelectChange) return;
      try {
        await loadDongOptionsByDistrict(guSelect.value);
        setMessage("비교1~3 동 목록을 불러왔습니다.");
      } catch (err) {
        renderDongLoading("동 목록을 불러오지 못했습니다");
        setMessage(`동 목록 조회 실패: ${err.message}`, true);
      }
    });

    favoritesModalBody.addEventListener("click", async (e) => {
      const notifyBtn = e.target.closest("[data-fav-notify]");
      if (notifyBtn) {
        e.stopPropagation();
        const k = decodeURIComponent(notifyBtn.getAttribute("data-fav-notify") || "");
        const turningOn = notifyBtn.getAttribute("data-notify-on") !== "1";
        setFavoriteNotify(k, turningOn);
        renderManageFavoritesModal();
        try {
          const data = await syncNotifySubscriptions();
          if (turningOn && data?.store?.warning) {
            setMessage(data.store.warning, true);
          } else if (turningOn) {
            setMessage("알림이 켜졌습니다. 매일 9:30에 당일 실거래가를 카카오톡으로 보냅니다.");
          } else {
            setMessage("알림이 꺼졌습니다.");
          }
        } catch (err) {
          setMessage(`알림 서버 동기화 실패: ${err.message}`, true);
        }
        return;
      }
      const rm = e.target.closest("[data-fav-remove]");
      if (rm) {
        removeFavoriteByKey(decodeURIComponent(rm.getAttribute("data-fav-remove") || ""));
        renderManageFavoritesModal();
        renderDealTable();
        return;
      }
      const tg = e.target.closest("[data-fav-modal-toggle]");
      if (tg) {
        const k = decodeURIComponent(tg.getAttribute("data-fav-modal-toggle") || "");
        const f = readFavorites().find((x) => favoriteKey(x) === k);
        if (f) {
          toggleFavorite(f);
        }
        renderManageFavoritesModal();
        renderDealTable();
      }
    });

    slotFavModalBody.addEventListener("click", async (e) => {
      const star = e.target.closest("[data-slot-star]");
      if (star) {
        const k = decodeURIComponent(star.getAttribute("data-slot-star") || "");
        const f = readFavorites().find((x) => favoriteKey(x) === k);
        if (f) {
          toggleFavorite(f);
        }
        renderSlotFavModal();
        renderDealTable();
        return;
      }
      const row = e.target.closest("[data-fav-pick-key]");
      if (!row || !slotFavTargetId) return;
      const k = decodeURIComponent(row.getAttribute("data-fav-pick-key") || "");
      const fav = readFavorites().find((x) => favoriteKey(x) === k);
      if (!fav) return;
      slotFavModal.classList.remove("open");
      slotFavModal.setAttribute("aria-hidden", "true");
      await applyFavoriteToSlot(slotFavTargetId, fav);
      setMessage(`비교${slotFavTargetId}에 즐겨찾기 단지를 적용했습니다.`);
    });

    dealTableBody.addEventListener("click", (e) => {
      const b = e.target.closest("[data-fav-star]");
      if (!b) return;
      e.preventDefault();
      const lawdCd = b.getAttribute("data-lawd") || guSelect.value;
      const dong = decodeURIComponent(b.getAttribute("data-dong") || "");
      const apt = decodeURIComponent(b.getAttribute("data-apt") || "");
      const area = decodeURIComponent(b.getAttribute("data-area") || "").trim();
      const guName =
        getDistrictName(lawdCd) || getCurrentGuName();
      toggleFavorite({
        lawdCd,
        guName,
        dong,
        apt,
        area
      });
      renderDealTable();
    });

    document.getElementById("openFavoritesBtn").addEventListener("click", () => {
      renderManageFavoritesModal();
      favoritesModal.classList.add("open");
      favoritesModal.setAttribute("aria-hidden", "false");
    });

    document.getElementById("closeFavoritesModal").addEventListener("click", () => {
      favoritesModal.classList.remove("open");
      favoritesModal.setAttribute("aria-hidden", "true");
    });

    document.getElementById("closeSlotFavModal").addEventListener("click", () => {
      slotFavModal.classList.remove("open");
      slotFavModal.setAttribute("aria-hidden", "true");
    });

    favoritesModal.addEventListener("click", (e) => {
      if (e.target === favoritesModal) {
        favoritesModal.classList.remove("open");
        favoritesModal.setAttribute("aria-hidden", "true");
      }
    });

    slotFavModal.addEventListener("click", (e) => {
      if (e.target === slotFavModal) {
        slotFavModal.classList.remove("open");
        slotFavModal.setAttribute("aria-hidden", "true");
      }
    });

    document.querySelectorAll("[data-fav-pick-slot]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sid = Number(btn.getAttribute("data-fav-pick-slot"));
        if (Number.isFinite(sid)) {
          openSlotFavoritePicker(sid);
        }
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (favoritesModal.classList.contains("open")) {
        favoritesModal.classList.remove("open");
        favoritesModal.setAttribute("aria-hidden", "true");
      }
      if (slotFavModal.classList.contains("open")) {
        slotFavModal.classList.remove("open");
        slotFavModal.setAttribute("aria-hidden", "true");
      }
    });

    refreshMarketTicker();
    setInterval(refreshMarketTicker, MARKET_REFRESH_MS);

    setupRegionSelect();
    setupDistrictSelect(regionSelect.value);
    setupMonthsSelect();
    loadDongOptionsByDistrict(guSelect.value).catch((err) => {
      renderDongLoading("동 목록을 불러오지 못했습니다");
      setMessage(`동 목록 조회 실패: ${err.message}`, true);
    });
    slots.forEach(bindSlotEvents);
    loadMoreBtn.addEventListener("click", () => {
      visibleDealCount += TABLE_PAGE_SIZE;
      renderDealTable();
    });
    loadBtn.addEventListener("click", loadData);
  </script>
</body>
</html>
